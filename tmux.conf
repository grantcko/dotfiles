# Start window and pane numbering at 1.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# New tabs and splits follow the pane's directory; use home if it is unavailable.
bind c new-window -c '#{?pane_current_path,#{pane_current_path},#{HOME}}'
bind '"' split-window -c '#{?pane_current_path,#{pane_current_path},#{HOME}}'
bind % split-window -h -c '#{?pane_current_path,#{pane_current_path},#{HOME}}'

# Save the workspace every five minutes and restore it when tmux starts.
set -g @resurrect-dir '/Users/granthall/.tmux/resurrect'
set -g @resurrect-capture-pane-contents 'off'
set -g @resurrect-save-command-strategy 'ps-with-self-fallback'
set -g @resurrect-hook-post-restore-all 'tmux select-window -t "0:herdr" 2>/dev/null || true'
set -g @resurrect-processes '"~herdr.*--session tasty->/Users/granthall/.local/bin/tmux-resume-tasty" "~herdr.*--session default->/Users/granthall/.local/bin/tmux-resume-herdr"'
set -g @continuum-save-interval '5'
set -g @continuum-restore 'on'
run-shell '/Users/granthall/.tmux/plugins/tmux-resurrect/resurrect.tmux'
run-shell '/Users/granthall/.tmux/plugins/tmux-continuum/continuum.tmux'
